monitor=,preferred,auto,1

exec-once = waybar &
exec-once = nm-applet
exec-once = swaybg -i /home/rahatut/Pictures/Wallpapers/wallpaper.png -m fill
exec-once = mako

bind = SUPER, T, exec, kitty
bind = SUPER, D, exec, wofi --show drun
bind = SUPER, Q, killactive
bind = SUPER, M, exit
bind = , PRINT, exec, flameshot gui
bind = SUPER, B, exec, firefox
bind = SUPER, L, exec, hyprlock

input {
	kb_layout = us
}

general {
	gaps_in = 5
	gaps_out = 10
	border_size = 2
}

decoration {
	rounding = 8
}
