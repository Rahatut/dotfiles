# Kitty main configuration

# Load ONLY your theme (keep this first)
include ./catppuccin-mocha-green.conf

# -------------------------
# General settings
# -------------------------

scrollback_lines 10000
enable_audio_bell no
confirm_os_window_close 0

# -------------------------
# Fonts (uncomment + edit)
# -------------------------
font_family      JetBrainsMono Nerd Font
# font_size        13.0

# -------------------------
# Optional performance tweaks
# -------------------------
repaint_delay 10
input_delay 3

# -------------------------
# UI tweaks (optional)
# -------------------------
cursor_shape block
cursor_blink_interval 0.5

shell /bin/zsh
